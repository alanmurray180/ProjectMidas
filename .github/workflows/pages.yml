name: Build and deploy dashboard

on:
  schedule:
    # Cron is UTC-only and has no DST handling, so this is the union of the
    # BST and GMT windows for the UK working day:
    #   BST (UTC+1): 08:23-18:23 UK
    #   GMT (UTC+0): 07:23-17:23 UK
    # One of those edge slots falls outside 08:30-17:30 depending on the
    # offset in effect.  We used to drop it with a guard job; we no longer
    # do, because GitHub's delivery of this schedule turned out to be far
    # less reliable than the DST edge is costly.  See the build job.
    #
    # Minute 23 rather than :00 or :30 — GitHub queues scheduled runs and
    # the round numbers are the congested ones.
    - cron: "23 7-17 * * 1-5"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two builds race to deploy; let a running build finish rather
# than cancelling it, so a scheduled refresh is not lost to a manual run.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build static site
    runs-on: ubuntu-latest
    steps:
      # There was a guard job here that skipped any scheduled run landing
      # outside 08:00-17:59 UK, so that whichever cron slot the current DST
      # offset put outside the working day was dropped.  It was written on
      # the assumption that GitHub delivers a scheduled run within about
      # half an hour of its slot.
      #
      # It does not.  Delivery for this repo stopped entirely for a day and
      # then resumed 7.5 hours late, at 00:58 UTC, and the guard duly threw
      # that build away — turning a late refresh into no refresh at all, on
      # exactly the deliveries we were still getting.  Since Actions is free
      # on a public repo, the guard was trading a real refresh for one saved
      # build a day.  Now every delivered slot builds, whenever it arrives,
      # and the footer timestamp reports the true age of the data.
      - name: Report schedule context
        run: |
          set -euo pipefail
          echo "event:   ${{ github.event_name }}"
          echo "UK time: $(TZ=Europe/London date +'%a %Y-%m-%d %H:%M %Z')"
          echo "UTC:     $(date -u +'%Y-%m-%d %H:%M')"

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Render dashboard
        env:
          METALPRICEAPI_KEY: ${{ secrets.METALPRICEAPI_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          FINANCIAL_ANALYSIS_COT: ${{ secrets.FINANCIAL_ANALYSIS_COT }}
        run: python scripts/build_static.py dist

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
