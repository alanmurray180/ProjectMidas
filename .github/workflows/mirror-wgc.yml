name: Mirror WGC ETF flows xlsx

on:
  schedule:
    # Mondays 14:00 UTC — WGC typically publishes weekly updates on Monday.
    - cron: '0 14 * * 1'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Download latest WGC xlsx
        run: python -m midas.scripts.mirror_wgc

      - name: Commit & push refresh (if changed)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/midas/data/wgc/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: refresh WGC xlsx mirror"
            git push
          fi
