[project]
name = "project-midas"
version = "0.1.0"
description = "Gold trading analysis tool — pricing, positioning, ETF flows, and physical demand"
requires-python = ">=3.10"
dependencies = [
    "flask>=3.0",
    "gunicorn>=22.0",
    "httpx>=0.27",
    "pandas>=2.0",
    "python-dotenv>=1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
midas = ["templates/*.html"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]
